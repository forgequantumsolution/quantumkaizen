# Dependabot version updates are intentionally DISABLED.
#
# The previous config (with weekly schedules for /server, /client, and /)
# generated 20+ open PRs at a time and the team kept the branches lying
# around instead of merging them. The old config also referenced /server
# which no longer exists in this monorepo (it's /backend now).
#
# Re-enable when there's a clear owner for the weekly dependency-PR
# review. To re-enable: restore an earlier version of this file from
# git history (commit before this one) and adjust `directory` from
# `/server` to `/backend` to match the current layout.
#
# Manual dependency upgrades in the meantime:
#   npm outdated --workspace=client
#   npm outdated --workspace=backend
#   npx npm-check-updates -u --workspace=client     # bumps package.json
#   npm install && npm run build                    # verify

version: 2
updates: []
