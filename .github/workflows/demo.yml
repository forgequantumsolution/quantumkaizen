name: Deploy For Demo

on:
  push:
    branches: [shriyansh-backend]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend
  FRONTEND_PORT: '8081'
  API_PORT: '4000'

jobs:
  build:
    name: Build backend + frontend images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v5

      - name: Compute image tag (short SHA)
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./client/Dockerfile
          push: true
          # Relative /api — frontend nginx proxies to api:4000 internally.
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v5

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync compose + deploy script
        run: |
          rsync -avz \
            docker-compose.yml \
            deploy/deploy.sh \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/quantumkaizen
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'chmod +x /opt/quantumkaizen/deploy.sh'

      # Authenticate the VPS Docker to GHCR every deploy so we never rely on a
      # persistent login that can expire/clear (the cause of "registry: denied").
      # The token is piped over SSH stdin so it isn't visible in the VPS process list.
      - name: Log VPS in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin"

      # Compose interpolates BACKEND_IMAGE/FRONTEND_IMAGE/IMAGE_TAG from the
      # environment; POSTGRES_* still come from /opt/quantumkaizen/.env.
      - name: Validate compose renders with this tag
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/quantumkaizen && \
             IMAGE_TAG=${IMAGE_TAG} \
             BACKEND_IMAGE=${{ env.BACKEND_IMAGE }} \
             FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }} \
             docker compose -f docker-compose.yml config --images"

      - name: Pull images, migrate, restart on VPS
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/quantumkaizen && \
             IMAGE_TAG=${IMAGE_TAG} \
             BACKEND_IMAGE=${{ env.BACKEND_IMAGE }} \
             FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }} \
             bash deploy.sh"

      - name: Verify running containers match this build
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "docker inspect --format='{{.Config.Image}}' kaizen-api kaizen-worker kaizen-frontend" \
            | tee /tmp/running.txt
          grep -q "${IMAGE_TAG}" /tmp/running.txt \
            || { echo "Containers are not running ${IMAGE_TAG}"; exit 1; }

      - name: Public smoke test
        run: |
          # API direct
          for i in {1..10}; do
            if curl -fsS "http://${{ secrets.VPS_HOST }}:${{ env.API_PORT }}/health" > /dev/null; then
              echo "API healthy at :${{ env.API_PORT }}"
              break
            fi
            echo "Waiting for api... ($i/10)"
            sleep 3
          done
          curl -fsS "http://${{ secrets.VPS_HOST }}:${{ env.API_PORT }}/health" > /dev/null \
            || { echo "API never responded at :${{ env.API_PORT }}"; exit 1; }

          # Frontend shell
          curl -fsS "http://${{ secrets.VPS_HOST }}:${{ env.FRONTEND_PORT }}/" > /dev/null \
            || { echo "Frontend never responded at :${{ env.FRONTEND_PORT }}"; exit 1; }
          echo "Frontend healthy at :${{ env.FRONTEND_PORT }}"

          # Frontend → api proxy. Catches the nginx upstream-name mismatch that
          # a plain "/" probe cannot see.
          curl -fsS "http://${{ secrets.VPS_HOST }}:${{ env.FRONTEND_PORT }}/health" > /dev/null \
            || { echo "Frontend cannot reach api — check nginx proxy_pass upstream"; exit 1; }
          echo "Frontend → api proxy healthy"
