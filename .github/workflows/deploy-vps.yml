name: Deploy to GoDaddy VPS

# Builds backend + frontend images -> pushes to GHCR -> rsyncs compose +
# deploy.sh to VPS -> runs deploy.sh which pulls + migrates + rolls.
# Access: http://<VPS_IP>:8080 (frontend), http://<VPS_IP>:4000 (API).

on:
  push:
    branches: [shriyansh-backend]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  build:
    name: Build backend + frontend images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag (short SHA)
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./client/Dockerfile
          push: true
          # Relative /api — frontend nginx proxies to qk-api internally.
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync compose + deploy script
        run: |
          rsync -avz \
            docker-compose.prod.yml \
            deploy/deploy.sh \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/qk-v2/
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'chmod +x /var/www/qk-v2/deploy.sh'

      # Authenticate the VPS Docker to GHCR every deploy so we never rely on a
      # persistent login that can expire/clear (the cause of "registry: denied").
      # The token is piped over SSH stdin so it isn't visible in the VPS process list.
      - name: Log VPS in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin"

      - name: Pull images, migrate, restart on VPS
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /var/www/qk-v2 && \
             IMAGE_TAG=${IMAGE_TAG} \
             BACKEND_IMAGE=${{ env.BACKEND_IMAGE }} \
             FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }} \
             bash deploy.sh"

      - name: Public smoke test
        run: |
          # API direct
          for i in {1..10}; do
            if curl -fsS "http://${{ secrets.VPS_HOST }}:4000/health" > /dev/null; then
              echo "API healthy at :4000"
              break
            fi
            echo "Waiting for api... ($i/10)"
            sleep 3
          done
          curl -fsS "http://${{ secrets.VPS_HOST }}:4000/health" > /dev/null \
            || { echo "API never responded at :4000"; exit 1; }

          # Frontend (also proxies /health to api)
          curl -fsS "http://${{ secrets.VPS_HOST }}:8080/" > /dev/null \
            || { echo "Frontend never responded at :8080"; exit 1; }
          echo "Frontend healthy at :8080"
