# Frontend site — serves the Vite build from /var/www/quantumkaizen/client.
# Symlink this to /etc/nginx/sites-enabled/ on the VPS.
# certbot will inject the HTTPS server block + redirect after first issuance.

server {
    listen 80;
    listen [::]:80;
    server_name forgequantumsolution.com www.forgequantumsolution.com;

    root /var/www/quantumkaizen/client;
    index index.html;

    # ── Security headers ─────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS — uncomment AFTER certbot has issued certs and HTTPS works:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── SPA fallback ─────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Long-cache hashed Vite assets ────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Compression ──────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 10M;
}
