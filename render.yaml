# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Provisions two services that share this repo:
#   1. qk-api    — Express/Prisma backend (web service)
#   2. qk-worker — BullMQ worker (background worker) for SLA + approval crons
#
# External services (not provisioned here):
#   - PostgreSQL  → Neon (https://neon.tech)            — DATABASE_URL / DIRECT_URL
#   - Redis       → Upstash (https://upstash.com)       — REDIS_URL
#   - Frontend    → Vercel (vercel.json at repo root)
#
# First-time deploy:
#   1. Create the Neon project (or reuse the existing one) and copy its
#      pooled and direct connection strings.
#   2. Create an Upstash Redis database (Global / Regional doesn't matter)
#      and copy the rediss:// connection string.
#   3. Push this file to your default branch.
#   4. Render Dashboard → New + → Blueprint → pick this repo.
#   5. Render will prompt for the secret env vars marked `sync: false`
#      below. Paste the values from step 1–2 and a long random JWT_SECRET
#      (generate with: openssl rand -base64 48).
#   6. Click Apply. First build takes ~5 min (Prisma generate + tsc).
#
# Re-deploys: push to the configured branch; Render auto-redeploys.

services:
  # ─── API (Express / Prisma) ───────────────────────────────────────
  - type: web
    name: qk-api
    runtime: node
    plan: free
    rootDir: .
    # Workspaces install everything once. Build only the backend workspace
    # — `prisma generate` is explicit because workspaces don't always fire
    # the postinstall hook on Render's runtime.
    buildCommand: npm ci --no-audit && npx prisma generate --schema backend/prisma/schema.prisma && npm run build --workspace=backend
    # Apply any pending migrations on every deploy, then start the API.
    startCommand: cd backend && npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Secrets — fill in via the Render dashboard on first deploy.
      - key: DATABASE_URL
        sync: false       # Neon pooled connection (postgres://...?sslmode=require)
      - key: DIRECT_URL
        sync: false       # Neon direct connection (used by `migrate deploy`)
      - key: REDIS_URL
        sync: false       # Upstash rediss:// connection string
      - key: JWT_SECRET
        sync: false       # openssl rand -base64 48
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false       # Vercel URL, e.g. https://your-app.vercel.app

  # ─── Worker (BullMQ) ──────────────────────────────────────────────
  - type: worker
    name: qk-worker
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --no-audit && npx prisma generate --schema backend/prisma/schema.prisma && npm run build --workspace=backend
    startCommand: cd backend && node dist/jobs/worker.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
